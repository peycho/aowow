ServerName localhost
ServerTokens Prod
ServerSignature Off
PidFile /tmp/apache2/apache2.pid

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:8080>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory />
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html>
        Options +FollowSymLinks -Indexes -MultiViews
        AllowOverride Options FileInfo
        Require all granted
    </Directory>

    Alias /static /opt/aowow/static
    Alias /robots.txt /opt/aowow/static/download/robots.txt
    <Directory /opt/aowow/static>
        Options +FollowSymLinks -Indexes -MultiViews -Includes -ExecCGI
        AllowOverride Options FileInfo
        Require all granted
    </Directory>

    # A PHP HTTP probe independent of application setup/maintenance state.
    Alias /_docker-health.php /usr/local/lib/aowow/health-http.php
    <Directory /usr/local/lib/aowow>
        AllowOverride None
        Require local
    </Directory>
</VirtualHost>
